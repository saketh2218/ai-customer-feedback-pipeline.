version: '3.8'

services:
  web-dashboard:
    build: .
    container_name: feedback_analytics_dashboard
    ports:
      - "8501:8501"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
    volumes:
      - ./feedback_analytics.db:/app/feedback_analytics.db
      - ./customer_feedback_insights.xlsx:/app/customer_feedback_insights.xlsx
    command: ["streamlit", "run", "app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    restart: unless-stopped

  api-service:
    build: .
    container_name: feedback_analytics_api
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
    volumes:
      - ./feedback_analytics.db:/app/feedback_analytics.db
      - ./customer_feedback_insights.xlsx:/app/customer_feedback_insights.xlsx
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
